name: Editorial CI/CD (Lint & Build PDF/EPUB)

on:
  push:
    branches:
      - main
      - master
      - "changes/**"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  lint:
    name: Lint Markdown & Reglas del Repositorio
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Verificar principios de GEMINI.md (Cero binarios y Cero Base64)
        shell: bash
        run: |
          set -euo pipefail
          error=0

          echo "1. Verificando ausencia de artefactos binarios (.pdf, .epub, .docx) en Git..."
          binarios="$(git ls-files '*.pdf' '*.epub' '*.docx')"
          if [[ -n "$binarios" ]]; then
            echo "❌ Se encontraron binarios versionados prohibidos por GEMINI.md:"
            echo "$binarios"
            error=1
          else
            echo "   ✔ Cero binarios (.pdf/.epub/.docx) en Git."
          fi

          echo "2. Verificando que no existan imágenes sueltas dentro de content/..."
          img_fuera="$(git ls-files 'content/*.png' 'content/*.jpg' 'content/*.jpeg' 'content/*.svg' 'content/*.gif' 'content/*.webp' 'content/**/*.png' 'content/**/*.jpg' 'content/**/*.jpeg' 'content/**/*.svg' 'content/**/*.gif' 'content/**/*.webp')"
          if [[ -n "$img_fuera" ]]; then
            echo "❌ Se encontraron imágenes fuera de assets/:"
            echo "$img_fuera"
            error=1
          else
            echo "   ✔ Todas las imágenes residen en assets/."
          fi

          echo "3. Verificando ausencia de imágenes Base64 incrustadas en content/..."
          if grep -rn "data:image/" content/; then
            echo "❌ Se encontraron imágenes codificadas en Base64 dentro de content/."
            error=1
          else
            echo "   ✔ Cero imágenes Base64 en content/."
          fi

          exit "$error"

      - name: Ejecutar linter y normalizador (mdnorm --check)
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' archivos < <(find content -type f -name "*.md" -print0 | sort -z)
          ./toolchain/bin/mdnorm --check "${archivos[@]}"

  build:
    name: Compilar Apuntes (PDF & EPUB)
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Obtener o construir imagen Docker del toolchain (ghcr.io)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE="ghcr.io/${OWNER}/asi-toolchain"
          TAG_HASH="$(find toolchain/Dockerfile toolchain/pandoc -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-12)"
          echo "TOOLCHAIN_IMAGE=${IMAGE}:${TAG_HASH}" >> "$GITHUB_ENV"

          echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

          if docker pull "${IMAGE}:${TAG_HASH}"; then
            echo "✔ Imagen precompilada encontrada en GHCR: ${IMAGE}:${TAG_HASH}"
          else
            echo "⚙ Imagen ${IMAGE}:${TAG_HASH} no encontrada en GHCR. Construyendo desde toolchain/Dockerfile..."
            docker build \
              -t "${IMAGE}:${TAG_HASH}" \
              -t "${IMAGE}:latest" \
              -f toolchain/Dockerfile \
              toolchain

            if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
              echo "⬆ Publicando imagen en GHCR (${IMAGE}:${TAG_HASH} y :latest)..."
              docker push "${IMAGE}:${TAG_HASH}"
              docker push "${IMAGE}:latest"
            fi
          fi

      - name: Compilar unidades y guías prácticas a PDF y EPUB
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/workspace" \
            -w /workspace \
            "$TOOLCHAIN_IMAGE" \
            bash -c '
              set -euo pipefail
              mapfile -d "" archivos_compilar < <(
                find content/unidades content/practica \
                  -type f -name "*.md" ! -name "README.md" ! -path "*/borradores/*" -print0 2>/dev/null | sort -z
              )
              if (( ${#archivos_compilar[@]} == 0 )); then
                echo "❌ No se encontraron documentos para compilar."
                exit 1
              fi
              ./toolchain/bin/md2pdf -y --all "${archivos_compilar[@]}"
            '
          echo "=== Árbol de artefactos generados en build/ ==="
          find build -type f | sort

      - name: Publicar Unidades y Trabajos Prácticos en GitHub Releases
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          publicar_release() {
            local tag="$1"
            local titulo="$2"
            local carpeta="$3"
            local zip_name="$4"
            local es_latest="${5:-false}"

            [[ -d "$carpeta" ]] || return 0
            local archivos=()
            mapfile -d '' archivos < <(find "$carpeta" -type f \( -name "*.pdf" -o -name "*.epub" \) -print0 | sort -z)
            (( ${#archivos[@]} > 0 )) || return 0

            echo "=== Publicando Release: $titulo ($tag) ==="
            local tmp_dir
            tmp_dir="$(mktemp -d)"
            local zip_path="$tmp_dir/$zip_name"
            (
              cd "$carpeta"
              zip -r -q "$zip_path" . -i "*.pdf" "*.epub"
            )

            local repo_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"
            local notas="$tmp_dir/notas.md"
            {
              echo "### 📦 Descargar paquete completo de la unidad (PDF + EPUB)"
              echo "- [**📥 ${zip_name}**](${repo_url}/${zip_name})"
              echo ""
              echo "### 📄 Documentos individuales disponibles abajo en *Assets*"
              for f in "${archivos[@]}"; do
                echo "- \`$(basename "$f")\`"
              done
              echo ""
              echo "---"
              echo "*Compilado automáticamente a partir del commit \`${GITHUB_SHA:0:7}\`.*"
            } > "$notas"

            gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
            sleep 1
            gh release create "$tag" "$zip_path" "${archivos[@]}" \
              --target "$GITHUB_SHA" \
              --title "$titulo" \
              --notes-file "$notas" \
              --latest="$es_latest"

            rm -rf "$tmp_dir"
            sleep 1
          }

          # Se publican de abajo hacia arriba para que en /releases queden ordenadas
          # de Unidad I (arriba) a Unidad VI y luego los Trabajos Prácticos (abajo).
          publicar_release "practica-tp1" "🛠️ Práctica — TP1: Alineamiento Estratégico de SI/TI" "build/Practica/tp1-alineamiento" "Practica-TP1-Alineamiento.zip" "false"
          publicar_release "practica-tpi" "🛠️ Práctica — TPI: Vialidad Provincial (DVP)" "build/Practica/tpi-dvp" "Practica-TPI-DVP.zip" "false"
          publicar_release "unidad-vi"    "📘 Unidad VI — Seguridad y Auditoría de SI/TI" "build/Unidad VI" "Unidad-VI-Completa.zip" "false"
          publicar_release "unidad-v"     "📘 Unidad V — Subsistema de Seguimiento y Control" "build/Unidad V" "Unidad-V-Completa.zip" "false"
          publicar_release "unidad-iv"    "📘 Unidad IV — Mantenimiento y Desarrollo" "build/Unidad IV" "Unidad-IV-Completa.zip" "false"
          publicar_release "unidad-iii"   "📘 Unidad III — Subsistema de Aplicación" "build/Unidad III" "Unidad-III-Completa.zip" "false"
          publicar_release "unidad-ii"    "📘 Unidad II — Subsistema de Provisión" "build/Unidad II" "Unidad-II-Completa.zip" "false"
          publicar_release "unidad-i"     "📘 Unidad I — Los SI en la Empresa y Estrategia SI/TI" "build/Unidad I" "Unidad-I-Completa.zip" "true"

      - name: Publicar Artefactos de vista previa (solo en Pull Requests)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: preview-pr-pdf-epub
          path: |
            build/**/*.pdf
            build/**/*.epub
          if-no-files-found: error
          retention-days: 3
